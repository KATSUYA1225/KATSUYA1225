skill_version: "1.0"
role_id: restaurant_ops
display_name: "飲食コンサル"
display_name_en: "Restaurant Consultant"
description: "飲食店の収益改善・メニュー最適化・集客・オペレーション強化を専門とするエージェント"
is_mandatory: false
price_tier: premium
monthly_price_jpy: 4980
