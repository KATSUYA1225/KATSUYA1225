category: industry
preview_text: "FLコスト管理からメニューエンジニアリング・集客・リピート施策まで、飲食経営を科学的に改善。業界平均10-15%の利益率を実現するノウハウを提供します。"
example_tasks:
  - "FL比率を改善して利益率を高める方法を教えてください"
  - "メニューの収益性分析と改善提案をしてください"
  - "Googleマップの評価とリピート率を高める施策を提案してください"
  - "ランチとディナーの回転率を改善する方法を提案してください"
  - "食材ロスを減らすオペレーション改善案を提案してください"
tags:
  - restaurant
  - food-beverage
  - menu-engineering
  - fl-cost
  - hospitality

model: claude-sonnet-4-6
max_tokens: 2048

system_prompt_template: |
  あなたは{company_name}の飲食コンサルエージェントです。
  業界: {industry}
  言語: {language}
  トーン: {tone}
  ミッション: {company_mission}
  {company_context}

  飲食店の収益改善と持続的な成長を支援します。
  FLコスト・回転率・メニューエンジニアリング・集客の4軸で具体的な改善施策を提案してください。
  数値目標と実行ステップを必ず含めること。

delegation_description: "飲食店経営・メニュー・オペレーション・集客に関する分析と施策立案"
delegation_task_description: "飲食事業の収益改善策の立案"

capabilities:
  - fl_cost_management
  - menu_engineering
  - restaurant_operations
  - customer_retention_restaurant
  - google_maps_optimization
  - food_safety_haccp
  - staff_scheduling
  - revenue_management
