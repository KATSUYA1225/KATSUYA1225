<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — スキル管理ダッシュボード | AI企業OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --cyan:    #00d4ff;
      --violet:  #7c3aed;
      --pink:    #e879f9;
      --emerald: #10b981;
      --amber:   #f59e0b;
      --red:     #ef4444;
      --bg:      #030712;
      --surface: rgba(255,255,255,0.03);
      --border:  rgba(255,255,255,0.07);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #e2e8f0;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 40% at 20% -10%, rgba(124,58,237,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(0,212,255,.10) 0%, transparent 60%);
      pointer-events: none;
    }
    #app { position: relative; z-index: 1; }
    .glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }
    .glass-hover:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(0,212,255,0.2);
      transition: all .2s;
    }
    .grad-text {
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-danger {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-danger:hover { opacity: .85; }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background .2s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.10); }
    .star { color: var(--amber); }
    .star.empty { color: #334155; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-great  { background: rgba(16,185,129,.15); color: #10b981; }
    .badge-ok     { background: rgba(245,158,11,.15);  color: #f59e0b; }
    .badge-poor   { background: rgba(239,68,68,.15);   color: #ef4444; }
    .badge-unset  { background: rgba(148,163,184,.10); color: #94a3b8; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .playbook-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s;
      color: #94a3b8;
    }
    .tab-btn.active {
      background: rgba(0,212,255,.1);
      border-color: rgba(0,212,255,.3);
      color: var(--cyan);
    }
    .tab-btn:not(.active):hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
    .rating-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
    .rating-fill { height: 100%; border-radius: 2px; transition: width .4s; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 500;
      z-index: 9999;
      animation: slideIn .3s ease;
    }
    .toast-success { background: rgba(16,185,129,.9); color: #fff; }
    .toast-error   { background: rgba(239,68,68,.9);  color: #fff; }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
<div id="app" class="max-w-6xl mx-auto px-4 py-8">

  <!-- ヘッダー -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <div class="flex items-center gap-3 mb-1">
        <a href="/app" class="text-slate-500 hover:text-slate-300 text-sm transition-colors">← アプリに戻る</a>
        <span class="text-slate-700">|</span>
        <span class="text-xs mono" style="color:var(--cyan);">ADMIN</span>
      </div>
      <h1 class="text-2xl font-bold" style="font-family:'Space Grotesk',sans-serif;">
        <span class="grad-text">スキル管理</span> ダッシュボード
      </h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="refreshAll()" class="btn-ghost rounded-xl px-4 py-2 text-sm flex items-center gap-2">
        <span id="refreshIcon">↻</span> 更新
      </button>
    </div>
  </div>

  <!-- タブ -->
  <div class="flex gap-2 mb-6">
    <button class="tab-btn active" onclick="switchTab('feedback', this)">フィードバック一覧</button>
    <button class="tab-btn" onclick="switchTab('upgrade', this)">スキルアップグレード</button>
    <button class="tab-btn" onclick="switchTab('playbooks', this)">プレイブック一覧</button>
  </div>

  <!-- ── TAB: フィードバック ── -->
  <div id="tab-feedback">
    <div id="feedbackOverview" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="glass rounded-2xl p-6 col-span-full flex items-center justify-center" style="min-height:200px;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- ── TAB: アップグレード ── -->
  <div id="tab-upgrade" class="hidden">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- 左: スキル選択 & 生成 -->
      <div class="space-y-4">
        <div class="glass rounded-2xl p-6">
          <h2 class="text-base font-bold mb-4" style="font-family:'Space Grotesk',sans-serif; color:var(--cyan);">改善案を生成</h2>
          <div class="space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1.5">スキルを選択</label>
              <select id="upgradeSkillSelect"
                class="w-full rounded-xl px-3 py-2.5 text-sm text-slate-200 border border-slate-700 focus:outline-none focus:border-cyan-500"
                style="background:rgba(255,255,255,0.05);">
                <option value="">-- スキルを選択してください --</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <input type="checkbox" id="dryRunCheck" class="rounded">
              <label for="dryRunCheck" class="text-sm text-slate-400">Dry-run（Claudeを呼ばない）</label>
            </div>
            <button id="proposeBtn" onclick="proposeUpgrade()" class="btn-primary w-full rounded-xl py-2.5 text-sm flex items-center justify-center gap-2" disabled>
              <span id="proposeIcon">✦</span>
              <span id="proposeBtnText">改善案を生成</span>
            </button>
          </div>
        </div>

        <!-- バージョン履歴 -->
        <div class="glass rounded-2xl p-6" id="historyBox" style="display:none;">
          <h3 class="text-sm font-bold mb-3 text-slate-300">バージョン履歴</h3>
          <div id="historyList" class="space-y-2 text-xs mono text-slate-400"></div>
        </div>
      </div>

      <!-- 右: 改善案プレビュー -->
      <div id="proposalBox" class="hidden">
        <div class="glass rounded-2xl p-6 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold" style="font-family:'Space Grotesk',sans-serif; color:var(--emerald);">改善案プレビュー</h2>
            <div class="flex items-center gap-2 text-xs">
              <span class="text-slate-500" id="proposalVersionFrom"></span>
              <span class="text-slate-500">→</span>
              <span class="font-bold" style="color:var(--cyan);" id="proposalVersionTo"></span>
            </div>
          </div>

          <!-- 変更ログ -->
          <div>
            <div class="text-xs text-slate-500 mb-1.5 font-semibold uppercase tracking-wider">変更ログ</div>
            <div id="proposalChangelog" class="glass rounded-xl p-3 text-sm text-slate-300 leading-relaxed"></div>
          </div>

          <!-- フィードバック統計 -->
          <div>
            <div class="text-xs text-slate-500 mb-1.5 font-semibold uppercase tracking-wider">フィードバック統計</div>
            <div id="proposalFeedback" class="flex items-center gap-4 text-sm"></div>
          </div>

          <!-- プレイブック改善 -->
          <div>
            <div class="text-xs text-slate-500 mb-1.5 font-semibold uppercase tracking-wider">改善されたプレイブック（先頭600文字）</div>
            <div id="proposalPlaybook" class="playbook-box mono text-slate-300 text-xs"></div>
          </div>

          <!-- 承認ボタン -->
          <div class="flex gap-3 pt-2">
            <button id="applyBtn" onclick="applyUpgrade()" class="btn-primary flex-1 rounded-xl py-2.5 text-sm flex items-center justify-center gap-2">
              <span id="applyIcon">✓</span>
              <span id="applyBtnText">この改善案を承認・適用</span>
            </button>
            <button onclick="clearProposal()" class="btn-ghost rounded-xl px-4 py-2.5 text-sm">キャンセル</button>
          </div>
        </div>
      </div>

      <div id="proposalPlaceholder" class="glass rounded-2xl p-8 flex flex-col items-center justify-center text-center gap-3">
        <div class="text-4xl opacity-30">✦</div>
        <p class="text-slate-500 text-sm">スキルを選択して「改善案を生成」をクリックすると<br>Claudeが分析・改善案を作成します</p>
      </div>
    </div>
  </div>

  <!-- ── TAB: プレイブック ── -->
  <div id="tab-playbooks" class="hidden">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div>
        <h3 class="text-sm font-bold text-slate-400 mb-3">スキル一覧</h3>
        <div id="playbookSkillList" class="space-y-1"></div>
      </div>
      <div class="lg:col-span-2">
        <div id="playbookViewBox" class="glass rounded-2xl p-6 hidden">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 id="playbookTitle" class="font-bold" style="font-family:'Space Grotesk',sans-serif; color:var(--cyan);"></h3>
              <span id="playbookVersion" class="text-xs text-slate-500 mono"></span>
            </div>
          </div>
          <div id="playbookContent" class="playbook-box mono text-slate-300 text-xs"></div>
        </div>
        <div id="playbookPlaceholder" class="glass rounded-2xl p-8 flex items-center justify-center text-slate-500 text-sm">
          左のスキルを選択してプレイブックを表示
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  let allSkills = []
  let currentProposal = null
  let activeTab = 'feedback'

  /* ── タブ切替 ── */
  function switchTab(name, el) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
    el.classList.add('active')
    ;['feedback','upgrade','playbooks'].forEach(t => {
      document.getElementById('tab-'+t).classList.toggle('hidden', t !== name)
    })
    activeTab = name
    if (name === 'feedback' && document.getElementById('feedbackOverview').children.length === 1) loadFeedback()
    if (name === 'playbooks' && document.getElementById('playbookSkillList').children.length === 0) loadPlaybookList()
  }

  /* ── Toast ── */
  function toast(msg, type='success') {
    const el = document.createElement('div')
    el.className = `toast toast-${type}`
    el.textContent = msg
    document.body.appendChild(el)
    setTimeout(() => el.remove(), 3500)
  }

  /* ── Stars ── */
  function stars(avg) {
    if (!avg) return '<span class="text-slate-600 text-xs">評価なし</span>'
    const full = Math.round(avg)
    return Array.from({length:5}, (_,i) =>
      `<span class="${i < full ? 'star' : 'star empty'}">★</span>`
    ).join('')
  }

  /* ── スキル一覧取得 ── */
  async function loadSkillList() {
    try {
      const res = await fetch('/v1/skills')
      const data = await res.json()
      allSkills = data.skills || []
      const sel = document.getElementById('upgradeSkillSelect')
      allSkills.forEach(s => {
        const opt = document.createElement('option')
        opt.value = s.role_id
        opt.textContent = `${s.display_name}（${s.role_id}）`
        sel.appendChild(opt)
      })
      sel.addEventListener('change', () => {
        document.getElementById('proposeBtn').disabled = !sel.value
        if (sel.value) loadHistory(sel.value)
        else { document.getElementById('historyBox').style.display = 'none' }
      })
    } catch(e) { console.error(e) }
  }

  /* ── フィードバック一覧 ── */
  async function loadFeedback() {
    const container = document.getElementById('feedbackOverview')
    container.innerHTML = '<div class="glass rounded-2xl p-6 col-span-full flex items-center justify-center" style="min-height:200px;"><div class="spinner"></div></div>'
    try {
      const res = await fetch('/v1/admin/feedback-overview')
      const data = await res.json()
      const summaries = data.summaries || {}
      if (Object.keys(summaries).length === 0) {
        container.innerHTML = '<div class="glass rounded-2xl p-8 col-span-full text-center text-slate-500">まだフィードバックがありません</div>'
        return
      }
      container.innerHTML = ''
      const sorted = Object.entries(summaries).sort((a,b) => (b[1].avg_rating||0)-(a[1].avg_rating||0))
      sorted.forEach(([sid, s]) => {
        const avgPct = s.avg_rating ? (s.avg_rating / 5 * 100).toFixed(0) : 0
        const fillColor = s.avg_rating >= 4 ? 'var(--emerald)' : s.avg_rating >= 3 ? 'var(--amber)' : 'var(--red)'
        const badgesHtml = Object.entries(s.quality_breakdown||{}).map(([tag,cnt]) =>
          `<span class="badge badge-${tag}">${tag} ×${cnt}</span>`
        ).join(' ')
        const skillName = allSkills.find(sk => sk.role_id === sid)?.display_name || sid
        const card = document.createElement('div')
        card.className = 'glass glass-hover rounded-2xl p-5 cursor-pointer'
        card.onclick = () => { switchTab('upgrade', document.querySelectorAll('.tab-btn')[1]); setTimeout(()=>{ document.getElementById('upgradeSkillSelect').value = sid; document.getElementById('upgradeSkillSelect').dispatchEvent(new Event('change')); document.getElementById('proposeBtn').disabled = false }, 50) }
        card.innerHTML = `
          <div class="flex items-start justify-between mb-3">
            <div>
              <div class="font-bold text-sm mb-0.5" style="font-family:'Space Grotesk',sans-serif;">${skillName}</div>
              <div class="text-xs mono text-slate-500">${sid}</div>
            </div>
            <div class="text-right">
              <div class="text-xs font-bold" style="color:${fillColor};">${s.avg_rating?.toFixed(1) || '-'}</div>
              <div class="text-xs text-slate-600">${s.count}件</div>
            </div>
          </div>
          <div class="rating-bar mb-3">
            <div class="rating-fill" style="width:${avgPct}%;background:${fillColor};"></div>
          </div>
          <div class="flex gap-1 flex-wrap mb-2">${badgesHtml}</div>
          ${s.recent_notes?.length ? `<div class="text-xs text-slate-500 truncate">「${s.recent_notes[0]}」</div>` : ''}
          <div class="mt-3 text-xs" style="color:var(--cyan);">クリックでアップグレード →</div>
        `
        container.appendChild(card)
      })
    } catch(e) {
      container.innerHTML = '<div class="glass rounded-2xl p-6 col-span-full text-center text-red-400">読み込みエラー</div>'
    }
  }

  /* ── バージョン履歴 ── */
  async function loadHistory(skillId) {
    const box = document.getElementById('historyBox')
    const list = document.getElementById('historyList')
    try {
      const res = await fetch(`/v1/skills/${skillId}/feedback`)
      const data = await res.json()
      const history = data.version_history || []
      if (history.length === 0) { box.style.display = 'none'; return }
      list.innerHTML = history.map(h =>
        `<div class="flex gap-3 py-1 border-b border-slate-800 last:border-0">
          <span style="color:var(--cyan);">v${h.version}</span>
          <span class="text-slate-600">${h.upgraded_at?.slice(0,10)}</span>
          <span class="flex-1 truncate">${h.changelog?.slice(0,50) || '-'}</span>
        </div>`
      ).join('')
      box.style.display = ''
    } catch {}
  }

  /* ── 改善案生成 ── */
  async function proposeUpgrade() {
    const skillId = document.getElementById('upgradeSkillSelect').value
    const dryRun  = document.getElementById('dryRunCheck').checked
    if (!skillId) return

    const btn = document.getElementById('proposeBtn')
    const icon = document.getElementById('proposeIcon')
    const txt  = document.getElementById('proposeBtnText')
    btn.disabled = true
    icon.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;"></div>'
    txt.textContent = dryRun ? 'Dry-run中...' : 'Claudeが分析中...'

    try {
      const res = await fetch(`/v1/admin/skills/${skillId}/upgrade/propose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dry_run: dryRun })
      })
      if (!res.ok) throw new Error(await res.text())
      currentProposal = await res.json()
      showProposal(currentProposal)
      toast('改善案を生成しました')
    } catch(e) {
      toast('生成に失敗しました: ' + e.message, 'error')
    } finally {
      btn.disabled = false
      icon.textContent = '✦'
      txt.textContent = '改善案を生成'
    }
  }

  function showProposal(p) {
    document.getElementById('proposalBox').classList.remove('hidden')
    document.getElementById('proposalPlaceholder').classList.add('hidden')
    document.getElementById('proposalVersionFrom').textContent = `v${p.current_version}`
    document.getElementById('proposalVersionTo').textContent   = `v${p.proposed_version}`
    document.getElementById('proposalChangelog').textContent   = p.changelog || '-'

    const fb = p.feedback_summary || {}
    document.getElementById('proposalFeedback').innerHTML = fb.count
      ? `<span class="text-slate-400">${fb.count}件</span>
         <span>${stars(fb.avg_rating)}</span>
         <span class="font-bold" style="color:var(--amber);">${fb.avg_rating?.toFixed(1)}</span>`
      : '<span class="text-slate-600">フィードバックなし</span>'

    document.getElementById('proposalPlaybook').textContent =
      (p.improved_playbook || '').slice(0, 600) + (p.improved_playbook?.length > 600 ? '\n...' : '')
  }

  function clearProposal() {
    currentProposal = null
    document.getElementById('proposalBox').classList.add('hidden')
    document.getElementById('proposalPlaceholder').classList.remove('hidden')
  }

  /* ── 改善案適用 ── */
  async function applyUpgrade() {
    if (!currentProposal) return
    if (!confirm(`スキル「${currentProposal.skill_id}」を v${currentProposal.current_version} → v${currentProposal.proposed_version} にアップグレードします。\n\nよろしいですか？`)) return

    const btn  = document.getElementById('applyBtn')
    const icon = document.getElementById('applyIcon')
    const txt  = document.getElementById('applyBtnText')
    btn.disabled = true
    icon.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;"></div>'
    txt.textContent = '適用中...'

    try {
      const res = await fetch(`/v1/admin/skills/${currentProposal.skill_id}/upgrade/apply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentProposal)
      })
      if (!res.ok) throw new Error(await res.text())
      const result = await res.json()
      toast(`✓ v${result.upgraded_to} にアップグレードしました！`)
      clearProposal()
      await loadHistory(currentProposal?.skill_id || document.getElementById('upgradeSkillSelect').value)
    } catch(e) {
      toast('適用に失敗しました: ' + e.message, 'error')
    } finally {
      btn.disabled = false
      icon.textContent = '✓'
      txt.textContent = 'この改善案を承認・適用'
    }
  }

  /* ── プレイブック一覧 ── */
  async function loadPlaybookList() {
    const list = document.getElementById('playbookSkillList')
    list.innerHTML = '<div class="text-slate-600 text-sm p-2">読み込み中...</div>'
    if (allSkills.length === 0) {
      await loadSkillList()
    }
    list.innerHTML = ''
    allSkills.forEach(s => {
      const btn = document.createElement('button')
      btn.className = 'w-full text-left px-3 py-2 rounded-lg text-sm transition-colors hover:bg-white/5 text-slate-400 hover:text-slate-200'
      btn.textContent = s.display_name || s.role_id
      btn.onclick = () => loadPlaybook(s.role_id, s.display_name)
      list.appendChild(btn)
    })
  }

  async function loadPlaybook(skillId, name) {
    document.getElementById('playbookPlaceholder').classList.add('hidden')
    const box = document.getElementById('playbookViewBox')
    box.classList.remove('hidden')
    document.getElementById('playbookTitle').textContent = name || skillId
    document.getElementById('playbookVersion').textContent = '読み込み中...'
    document.getElementById('playbookContent').textContent = ''
    try {
      const res = await fetch(`/v1/skills/${skillId}/playbook`)
      const data = await res.json()
      document.getElementById('playbookVersion').textContent = `v${data.version}`
      document.getElementById('playbookContent').textContent = data.playbook || '（プレイブックなし）'
    } catch {
      document.getElementById('playbookContent').textContent = '読み込みエラー'
    }
  }

  /* ── 全更新 ── */
  async function refreshAll() {
    const icon = document.getElementById('refreshIcon')
    icon.style.display = 'inline-block'
    icon.style.animation = 'spin .6s linear infinite'
    await loadFeedback()
    icon.style.animation = ''
    toast('更新しました')
  }

  /* ── 初期化 ── */
  ;(async function init() {
    await loadSkillList()
    await loadFeedback()
  })()
</script>
</body>
</html>
